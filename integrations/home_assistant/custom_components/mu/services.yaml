load_playlist:
  name: Load Playlist
  description: Load a playlist into a renderer's playback queue.
  fields:
    renderer:
      name: Renderer
      description: Name or ID of the target renderer.
      required: true
      example: "living-room"
      selector:
        text:
    playlist:
      name: Playlist
      description: Name or ID of the playlist to load.
      required: true
      example: "Evening Jazz"
      selector:
        text:
    mode:
      name: Mode
      description: How to load the playlist into the queue.
      default: "replace"
      selector:
        select:
          options:
            - "replace"
            - "append"
            - "next"
    resolve:
      name: Resolve
      description: Whether to resolve library references to playable URLs.
      default: "auto"
      selector:
        select:
          options:
            - "auto"
            - "yes"
            - "no"

clear_queue:
  name: Clear Queue
  description: Remove all entries from a renderer's playback queue.
  fields:
    renderer:
      name: Renderer
      description: Name or ID of the target renderer.
      required: true
      example: "living-room"
      selector:
        text:

shuffle_queue:
  name: Shuffle Queue
  description: Randomly reorder the entries in a renderer's playback queue.
  fields:
    renderer:
      name: Renderer
      description: Name or ID of the target renderer.
      required: true
      example: "living-room"
      selector:
        text:

save_snapshot:
  name: Save Snapshot
  description: Save the current queue state as a named snapshot.
  fields:
    renderer:
      name: Renderer
      description: Name or ID of the renderer whose queue to snapshot.
      required: true
      example: "living-room"
      selector:
        text:
    name:
      name: Snapshot Name
      description: Name for the snapshot.
      required: true
      example: "Friday Night Mix"
      selector:
        text:
