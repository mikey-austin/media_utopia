services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:latest
    container_name: media_utopia_ha
    restart: unless-stopped
    network_mode: host
    ports:
      - "8123:8123"
    volumes:
      - ./ha_config:/config
      - ./custom_components/mu:/config/custom_components/mu
      - ./ha_config/ca:/config/ca:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
    environment:
      - TZ=UTC
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    depends_on:
      - mqtt

  mqtt:
    image: eclipse-mosquitto:2
    container_name: media_utopia_mqtt
    restart: unless-stopped
    ports:
      - "2883:2883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  mud:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: mud
    image: media_utopia_mud
    container_name: media_utopia_mud
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mqtt
    user: "1000:1000"
    volumes:
      - ./mud_config:/config
    environment:
      - HOME=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
      - XDG_CONFIG_HOME=/tmp/.config
      - XDG_DATA_HOME=/tmp/.local/share
      - XDG_RUNTIME_DIR=/tmp
    entrypoint: ["/usr/local/bin/mud"]
    command: ["--config", "/config/mud.toml"]
